name: Android EAS Preview Build

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo project
        run: npx eas-cli project:info --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: Start Android preview build
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
