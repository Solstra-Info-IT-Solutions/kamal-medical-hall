name: Backend VPS Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to Bluehost VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript validation
        working-directory: backend
        run: npm run typecheck

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts

          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | grep -Fx "$VPS_HOST_FINGERPRINT"

      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'

            set -e

            cd /home/deploy/apps/KamalMedicalHall

            test "$(git branch --show-current)" = "main" || { echo "VPS is not on main branch."; exit 1; }
            test -z "$(git status --porcelain)" || { echo "VPS working tree is not clean."; exit 1; }

            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git merge --ff-only origin/main

            cd backend

            npm ci

            pm2 restart kamal-medical-hall-api --update-env

            for attempt in {1..10}; do
              if curl --fail --silent --show-error \
                https://api.kamalmedicalhall.com/health; then
                exit 0
              fi

              sleep 3
            done

            echo "API health check failed after deployment."
            exit 1

          REMOTE
